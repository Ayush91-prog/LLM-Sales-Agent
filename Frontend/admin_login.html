<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Admin Auth - AI Sales Agent</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/forms.css">
    <style>
        body{
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .auth-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-header h2 {
            margin: 0 0 0.5rem 0;
            color: #38bdf8;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #334155;
        }
         .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 3px solid #38bdf8;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .code-alert {
            display: none;
            background: #065f46;
            border: 1px solid #10b981;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .code-alert strong {
            font-size: 1.2rem;
            color: #34d399;
            display: block;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Sales Agent Admin</h2>
            <p style="color:#94a3b8; font-size:0.9rem;">
                Manage your store, products and policies
            </p>
        </div>
        <div class="tabs">
            <button  class="tab-btn active" id="loginTab">Sign In</button>
            <button  class="tab-btn " id="registerTab">Register Business</button>
        </div>
        <div id="codeAlert" class="code-alert">
            Registration Successful! Your Unique Admin Code:
            <strong id="displayAdminCode">ADM-XXXXXX</strong>
            <small style="color:#a7f3d0;">Save this code! You can use it to log in.</small>
        </div>

        <!-- Login form -->
         <form id="loginForm">
            <div class="form-group">
                <label for="loginIdentifier">Email or Admin <Code></Code></label>
                <input type="text" id="loginIdentifier" placeholder="e.g. admin@gmail.com or ADM-A3F912" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign in to Dashboard</button>
         </form>
         
         <!-- Registration Form -->
          <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label for="regName">Your Name</label>
                <input type="text" id="regName" placeholder="e.g. Shane Bezos" required>
            </div>

            <div class="form-group">
                <label for="regBusiness">Business / Store Name</label>
                <input type="text" id="regBusiness" placeholder="e.g. Bezos Electronics" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="admin@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Register Store</button>
          </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/admin_auth.js"></script>
</body>
</html>
