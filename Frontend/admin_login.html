<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Admin Auth - AI Sales Agent</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/forms.css">
    <style>
    * {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
        background-color: #ffffff;
        color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
    }
    .auth-card {
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        text-align: center;
    }
    .auth-header h2 {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        color: #000000;
    }
    .auth-header p {
        color: #666666;
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        line-height: 1.4;
    }
    .tabs {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 0.5rem;
    }
    .tab-btn {
        background: none;
        border: none;
        font-size: 0.95rem;
        font-weight: 600;
        color: #666666;
        cursor: pointer;
        padding-bottom: 0.3rem;
        border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
        color: #000000;
        border-bottom: 2px solid #000000;
    }
    .form-group {
        text-align: left;
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: #333333;
    }
    .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        border: 1.5px solid #cccccc;
        background: #ffffff;
        color: #000000;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        border-color: #000000;
    }
    .btn-submit {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        width: 100%;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 0.5rem;
    }
    .btn-submit:hover {
        opacity: 0.85;
    }
    .code-alert {
        display: none;
        background: #f0fdf4;
        border: 1.5px solid #22c55e;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        font-size: 0.9rem;
        color: #15803d;
        text-align: center;
    }
    .code-alert strong {
        display: block;
        font-size: 1.25rem;
        color: #166534;
        margin-top: 0.25rem;
    }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Sales Agent Admin</h2>
            <p style="color:#94a3b8; font-size:0.9rem;">
                Manage your store, products and policies
            </p>
        </div>
        <div class="tabs">
            <button  class="tab-btn active" id="loginTab">Sign In</button>
            <button  class="tab-btn " id="registerTab">Register Business</button>
        </div>
        <div id="codeAlert" class="code-alert">
            Registration Successful! Your Unique Admin Code:
            <strong id="displayAdminCode">ADM-XXXXXX</strong>
            <small style="color:#a7f3d0;">Save this code! You can use it to log in.</small>
        </div>

        <!-- Login form -->
         <form id="loginForm">
            <div class="form-group">
                <label for="loginIdentifier">Email or Admin <Code></Code></label>
                <input type="text" id="loginIdentifier" placeholder="e.g. admin@gmail.com or ADM-A3F912" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign in to Dashboard</button>
         </form>
         
         <!-- Registration Form -->
          <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label for="regName">Your Name</label>
                <input type="text" id="regName" placeholder="e.g. Shane Bezos" required>
            </div>

            <div class="form-group">
                <label for="regBusiness">Business / Store Name</label>
                <input type="text" id="regBusiness" placeholder="e.g. Bezos Electronics" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="admin@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Register Store</button>
          </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/admin_auth.js"></script>
</body>
</html>
