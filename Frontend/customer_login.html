<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - AI Sales Agent</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/forms.css">
    <style>
    * {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
        background-color: #ffffff;
        color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
    }
    .auth-card {
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        text-align: center;
    }
    .auth-header h2 {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        color: #000000;
    }
    .auth-header p {
        color: #666666;
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        line-height: 1.4;
    }
    .tabs {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 0.5rem;
    }
    .tab-btn {
        background: none;
        border: none;
        font-size: 0.95rem;
        font-weight: 600;
        color: #666666;
        cursor: pointer;
        padding-bottom: 0.3rem;
        border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
        color: #000000;
        border-bottom: 2px solid #000000;
    }
    .form-group {
        text-align: left;
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: #333333;
    }
    .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        border: 1.5px solid #cccccc;
        background: #ffffff;
        color: #000000;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        border-color: #000000;
    }
    .btn-submit {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        width: 100%;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 0.5rem;
    }
    .btn-submit:hover {
        opacity: 0.85;
    }
    .code-alert {
        display: none;
        background: #f0fdf4;
        border: 1.5px solid #22c55e;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        font-size: 0.9rem;
        color: #15803d;
        text-align: center;
    }
    .code-alert strong {
        display: block;
        font-size: 1.25rem;
        color: #166534;
        margin-top: 0.25rem;
    }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Customer Portal</h2>
            <p style="color:#94a3b8; font-size: 0.9rem;">Sign in to chat with your AI Sales Assistant</p>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="loginTab">Sign In</button>
            <button class="tab-btn" id="registerTab">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="customer@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Start Shopping Chat</button>
        </form>

        <!-- Register form -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="e.g. John Smith" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="customer@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="regPhone">Phone (Optional)</label>
                <input type="tel" id="regPhone" placeholder="+91 9876543211">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Create Customer Account</button>
        </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/customer_auth.js"></script>
</body>
</html>
