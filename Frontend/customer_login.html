<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - AI Sales Agent</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/forms.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .auth-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-header h2 {
            margin: 0 0 0.5rem 0;
            color: #38bdf8;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #334155;
        }
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 3px solid #38bdf8;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Customer Portal</h2>
            <p style="color:#94a3b8; font-size: 0.9rem;">Sign in to chat with your AI Sales Assistant</p>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="loginTab">Sign In</button>
            <button class="tab-btn" id="registerTab">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="customer@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Start Shopping Chat</button>
        </form>

        <!-- Register form -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="e.g. John Smith" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="customer@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="regPhone">Phone (Optional)</label>
                <input type="tel" id="regPhone" placeholder="+91 9876543211">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Create Customer Account</button>
        </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/customer_auth.js"></script>
</body>
</html>
